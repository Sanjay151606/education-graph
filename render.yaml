services:
  # Backend Web Service on Render (FastAPI / Uvicorn)
  - type: web
    name: braingraph-backend
    runtime: python
    rootDir: education-new-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        placeholder: "https://YOUR_VERCEL_FRONTEND.vercel.app"
        sync: false
      - key: CORS_ORIGINS
        placeholder: "https://YOUR_VERCEL_FRONTEND.vercel.app"
        sync: false
      - key: DATABASE_URL
        placeholder: "postgresql://postgres:YOUR_DB_PASSWORD@db.YOUR_PROJECT_ID.supabase.co:5432/postgres"
        sync: false
      - key: SUPABASE_URL
        placeholder: "https://YOUR_PROJECT_ID.supabase.co"
        sync: false
      - key: SUPABASE_KEY
        placeholder: "YOUR_SUPABASE_SERVICE_ROLE_KEY"
        sync: false
      - key: SUPABASE_JWT_SECRET
        placeholder: "YOUR_SUPABASE_JWT_SECRET"
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
